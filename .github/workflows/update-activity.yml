name: Cập nhật biểu đồ commit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Lấy dữ liệu và vẽ biểu đồ
        run: node scripts/update-activity.cjs
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
      - name: Lưu biểu đồ nếu có thay đổi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add assets/activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): update commit activity"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

